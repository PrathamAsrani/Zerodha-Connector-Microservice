spring.profiles.active=test

# Stubbed Zerodha credentials so the Spring context can load during tests.
# Production reads these from real env vars (see application-prod.properties).
ZERODHA_API_KEY=test-api-key
ZERODHA_CLIENT_ID=test-client-id
ZERODHA_API_SECRET=test-api-secret

# Use an in-memory-equivalent: point JPA at H2 if you ever add it. For now,
# fall back to localhost defaults; tests that need a real DB should @MockBean
# their repos or use @DataJpaTest with embedded H2.
spring.datasource.url=jdbc:postgresql://localhost:5432/zerodha
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
# Set the dialect explicitly so Hibernate doesn't try to open a real JDBC
# connection at context-load time (the test environment has no Postgres).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Don't auto-shutdown the test JVM if market is closed.
stock.scheduler.exit-when-market-closed=false
