server.port=${PORT:8080}
spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://localhost:5432/zerodha_connector_db
spring.datasource.username=pratham_asrani
spring.datasource.password=asrani_2002
spring.datasource.driver-class-name=org.postgresql.Driver

# (Optional) Explicitly specify Hibernate dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Other recommended JPA properties (optional)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.kite_base_uri=${KITE_BASE_URI:https://api.kite.trade}

application.shutdown=false

app.user.phone-number=9145495032

# Gmail SMTP for sell/scrape alerts. MAIL_APP_PASSWORD must be a Gmail App Password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:xx}
spring.mail.password=${MAIL_APP_PASSWORD:xx}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:prathamasrani.cs@gmail.com}}
app.mail.alert-to=${MAIL_ALERT_TO:asranipratham2002@gmail.com}

# Surface the X-REQUEST-ID set by MDCUtil on every log line, including
# the per-symbol virtual threads spawned by HoldingStrategyOrchestrator.
logging.pattern.level=%5p [%X{X-REQUEST-ID:-}]

KITE_BASE_URI=${KITE_BASE_URI:https://api.kite.trade}
MAIL_APP_PASSWORD=${MAIL_APP_PASSWORD:xx}
ZERODHA_API_KEY=${ZERODHA_API_KEY:xx}
ZERODHA_API_SECRET=${ZERODHA_API_SECRET:xx}
ZERODHA_CLIENT_ID=${ZERODHA_CLIENT_ID:xx}
